<!DOCTYPE html>
<!-- Plantilla web de Ceibo Libros: idioma español y sin traducción automática del navegador
     (Chrome traducía "Reservar" como "Reservador", "retires" como "retire", etc.) -->
<html lang="es" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="es" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; overscroll-behavior: none; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body class="notranslate" translate="no">
    <noscript>Necesitás activar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
  </body>
</html>
